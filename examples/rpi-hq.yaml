# Raspberry Pi HQ camera (IMX477, 2x2 binned raw), 1.55 mm fisheye; Pi all-sky scripts write no Bayer keyword.
# The camera of the simulator preset 'rpi-hq' (pyobs-cloudcover-sim --preset rpi-hq); thresholds tuned
# on simulated nights/days with benchmarks/accuracy.py --tune.
class: pyobs_cloudcover.application.Application
watch:
  path: /var/lib/allsky/images
  pattern: image-*.fits
  after: keep
camera:
  bayer: BGGR
  bit_depth: 12
  world_model:
    class: pyobs_cloudcover.world_model.FisheyeModel
    c_x: 1013.5
    c_y: 759.5
    f: 480.0
    a0: -1.5707963267948966
    projection: equidistant
    parity: -1
server:
  url: 0.0.0.0
  port: 8080
measurement_log:
  logger:
    type: influx
    url: http://localhost:8086
    bucket: allsky
    org: ''
    token: ''
  measurements:
    cloud_zenith:
    - type: zenith
      name: cloudcover
      altitude: 80.0
    cloud_total:
    - type: total
      name: cloudcover
    coverage:
    - type: change
      name: coverage-change
    - type: sun
      name: sun-coverage
      radius: 20.0
    - type: moon
      name: moon-coverage
      radius: 20.0
pipelines:
  night:
    alt_interval:
      start: null
      end: -18
    options:
      # photometric zero point of this camera (pyobs-cloudcover replay reports it)
      photometry:
        zero_point: 6.47
      cloud_map:
        threshold: 4.7
  day:
    # the colour method works into civil twilight (simulation: down to -6 deg)
    alt_interval:
      start: -6
      end: null
    options:
      cloud_map:
        threshold: 1.7
timezone: Africa/Johannesburg
location:
  longitude: 20.81
  latitude: -32.38
  elevation: 1760.0
