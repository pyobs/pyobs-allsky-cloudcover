# ZWO ASI178MM (mono) with a stereographic lens, mounted rotated by 90 degrees, images from N.I.N.A..
# The camera of the simulator preset 'zwo-asi178mm' (pyobs-cloudcover-sim --preset zwo-asi178mm); thresholds tuned
# on simulated nights/days with benchmarks/accuracy.py --tune.
class: pyobs_cloudcover.application.Application
watch:
  path: /var/lib/allsky/images
  pattern: '*_LIGHT.fits'
  after: keep
camera:
  orientation:
    rotate: 90
  world_model:
    class: pyobs_cloudcover.world_model.FisheyeModel
    c_x: 1039.5
    c_y: 1547.5
    f: 500.0
    a0: 3.141592653589793
    projection: stereographic
    parity: -1
server:
  url: 0.0.0.0
  port: 8080
measurement_log:
  logger:
    type: influx
    url: http://localhost:8086
    bucket: allsky
    org: ''
    token: ''
  measurements:
    cloud_zenith:
    - type: zenith
      name: cloudcover
      altitude: 80.0
    cloud_total:
    - type: total
      name: cloudcover
    coverage:
    - type: change
      name: coverage-change
    - type: sun
      name: sun-coverage
      radius: 20.0
    - type: moon
      name: moon-coverage
      radius: 20.0
pipelines:
  night:
    alt_interval:
      start: null
      end: -18
    options:
      cloud_map:
        threshold: 4.8
timezone: Africa/Johannesburg
location:
  longitude: 20.81
  latitude: -32.38
  elevation: 1760.0
