[project]
name = "pyobs-allsky-cloudcover"
version = "2.0.0.dev0"
description = "pyobs module that estimates cloud cover from all-sky camera images"
authors = [
    { name = "germanhydrogen", email = "admin@germanhydrogen.org" },
]
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "pyobs-core>=2.24,<3",
    "numpy>=2.2.5,<3",
    "scipy>=1.15.2,<2",
    "astropy>=7.0.1,<9",
    "astroplan>=0.10.1,<0.11",
    "aiohttp>=3.11.18,<4",
    "influxdb-client>=1.49.0",
    "opencv-python-headless>=4.10.0.84",
    "pydantic>=2.12.5",
    "pillow>=11.3.0",
    "asyncinotify>=4.2.1,<5 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
# pyobs-cloudcover catalog: download a deeper star catalogue
catalog = ["astroquery>=0.4.10"]
# pyobs-cloudcover replay --plot
plots = ["matplotlib>=3.9"]

[project.scripts]
pyobs-cloudcover = "pyobs_cloudcover.cli:main"
pyobs-cloudcover-sim = "pyobs_cloudcover.simulation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "pytest-asyncio>=0.26.0,<1.5",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov>=6.1.1,<8",
    "pytest-mock>=3.14.0,<4",
    "mypy>=1.15.0",
    "ruff>=0.15.0",
    "types-PyYAML>=6.0.12",
]
integration = [
    "testcontainers[influxdb]>=4.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pyobs_cloudcover"]

[tool.hatch.build.targets.wheel]
include = ["pyobs_cloudcover"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# influxdb-client ships py.typed but leaves most of Point/WriteApi unannotated
module = "pyobs_cloudcover.measurement_log.logger_strategies.influx"
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-m 'not integration and not accuracy'"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external services (Docker/InfluxDB)",
    "accuracy: accuracy regression run on full-size simulated images (slow)",
]
