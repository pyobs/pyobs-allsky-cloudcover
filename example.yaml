class: pyobs_cloudcover.application.Application

# Where images come from: a directory the capture software writes into (recommended) ...
watch:
  path: /var/lib/allsky/images
  # glob for the image files (FITS recommended; PNG/TIFF/JPEG work, but 8-bit/JPEG images lose faint stars)
  pattern: "*.fits"
  # what to do with an image once analysed: keep, delete or move (to 'archive')
  after: keep
  archive: ""

# ... and/or NewImageEvents from a pyobs camera module (name of that module)
# image_sender: allskycam

# Everything specific to the camera. Placeholders: run `pyobs-cloudcover calibrate` on a few clear-night
# images to fit the world model and build the mask (see docs, "Setting up a new camera").
camera:
  # Bayer pattern: auto (BAYERPAT/COLORTYP header keywords), none (mono) or RGGB/BGGR/GRBG/GBRG
  bayer: auto
  # raw image -> canonical: flip left/right, flip up/down, then rotate counter-clockwise (0/90/180/270)
  orientation: {flip_x: false, flip_y: false, rotate: 0}
  timestamp:
    # auto: header keywords, then filename_format, then the file's modification time
    source: auto
    keywords: [DATE-OBS]
    # filename_format: "image-%Y%m%d%H%M%S.fits"
    # time zone of timestamps that don't carry one
    timezone: UTC
  # saturation level in ADU; guessed from the data if not set (or set bit_depth)
  # saturation: 65535
  # master dark and hot-pixel map (raw orientation), sky mask (canonical orientation; nonzero = sky)
  dark: ""
  hot_pixels: ""
  mask: ""
  # world model in canonical full-resolution pixels; this placeholder is a 1.55 mm equidistant fisheye
  # centred on a 2028x1520 image
  world_model:
    class: pyobs_cloudcover.world_model.FisheyeModel
    c_x: 1013.5
    c_y: 759.5
    f: 480.0
    a0: 0.0
    projection: equidistant
    parity: 1

# Web service (see docs for the routes)
server:
  url: "0.0.0.0"
  port: 8080

# Influx DB (type: influx, memory or none)
measurement_log:
  logger:
    type: "influx"
    url: "http://localhost:8086"
    bucket: "allsky"
    org: ""
    token: ""

  measurements:
    cloud_zenith:
      - type: "zenith"
        name: "cloudcover"
        # lower altitude bound of the zenith region (degrees)
        altitude: 80.0
    cloud_total:
      - type: "total"
        name: "cloudcover"
    coverage:
      - type: "change"
        name: "coverage-change"
      - type: "sun"
        name: "sun-coverage"
        radius: 20.0
      - type: "moon"
        name: "moon-coverage"
        radius: 20.0


# Analysis pipelines by solar altitude ([start, end) in degrees)
pipelines:
  day:
    alt_interval:
      start: 18
      end:

    options:
      # binning of the colour-ratio map
      bin_size: 2
      cloud_map:
        # pixels with a colour ratio (blue/red + blue/green, raw colours) below this are cloudy;
        # camera specific, choose it with `pyobs-cloudcover replay`
        threshold: 1.85
      # radius masked around the sun (degrees)
      sun_apparent_size: 0.54

  night:
    alt_interval:
      start:
      end: -18

    options:
      # binning before star detection; must be even for colour (Bayer) cameras
      bin_size: 2

      catalog:
        # leave empty for the bundled Yale Bright Star Catalogue (V < ~6.5)
        filepath: ""
        filter:
          # lowest altitude (degrees) and faintest magnitude of the stars used
          alt: 30.0
          v_mag: 7.0
          # minimum distance between stars (pixels after binning)
          distance: 0.0

      # star detection: aperture photometry around each predicted star position
      detector:
        type: aperture
        # signal-to-noise a star needs to count as seen
        snr: 3.0
        # how far (binned pixels) a star may be from its predicted position
        search_radius: 2.0
        # stars on a background brighter than this fraction of saturation count as not seen
        max_background: 0.8

      # where the limiting magnitude is estimated
      altaz_grid:
        # points on the whole sphere (about a quarter are above 30 degrees)
        point_number: 100000
        limiting_altitude: 30

      lim_mag_map:
        # stars within this radius (degrees) estimate the limiting magnitude at a point
        radius: 7.0
        # robust (recommended) or border (1.x)
        estimator: robust
        # number of consecutive frames a star must be seen in
        integration_length: 1

      cloud_map:
        # points with a limiting magnitude below this are cloudy. Camera specific: choose it with
        # `pyobs-cloudcover replay` on a few nights of images.
        threshold: 4.6

      # radius masked around the moon (degrees)
      moon_apparent_size: 10.0

timezone: UTC
location:
  longitude: 0.0
  latitude: 0.0
  elevation: 0.0
