name: accuracy
on: [push, pull_request]

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install packages
        run: uv sync --all-extras --dev

      - name: Accuracy on simulated images vs. baseline
        run: uv run pytest -m accuracy -v
