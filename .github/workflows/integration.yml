name: integration
# tests against real services (InfluxDB in Docker); run by hand
on: workflow_dispatch

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install packages
        run: uv sync --all-extras --dev --group integration

      - name: Run integration tests
        run: uv run pytest -m integration -v
